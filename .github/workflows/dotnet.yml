name: .NET CI

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore T3Sharp.sln
    - name: Build
      run: dotnet build T3Sharp.sln --no-restore -c Release
    - name: Test TritTypes
      run: dotnet test tests/TritTypes.Tests/TritTypes.Tests.csproj --no-build -c Release
    - name: Test Simulator
      run: dotnet test tests/T3Simulator.InOrder.Tests/T3Simulator.InOrder.Tests.csproj --no-build -c Release
    - name: Test Interpreter
      run: dotnet test tests/T3Interpreter.Tests/T3Interpreter.Tests.csproj --no-build -c Release